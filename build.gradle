plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.1.0.4353'
base.archivesName = "killstreakcod"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.232"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        killstreakcod {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // 中文：Java 编译使用 UTF-8 字符编码。
}

// Keep the distributable JAR below 100 decimal MB.
// 中文：发行 JAR 须小于十进制 100 MB，防止后续资源更新无意突破体积限制。
tasks.named('jar') {
    doLast {
        def releaseJar = archiveFile.get().asFile
        if (releaseJar.length() >= 100000000L) {
            throw new GradleException("Release JAR must be below 100 MB: ${releaseJar.length()} bytes")
        }
    }
}

