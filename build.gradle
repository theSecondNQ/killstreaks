plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.2.0.4361'
base.archivesName = 'killstreaks-neoforge-1.21.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Isolated UI previews are development tools and are excluded from the release JAR.
// 中文：隔离界面预览仅供开发使用，不打入发行 JAR。
sourceSets {
    uiPreview {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = "21.1.232"

    runs {
        client {
            client()

            if (project.hasProperty('uiPreview')) {
                gameDirectory = project.file('build/ui-preview')
                systemProperty 'killstreakcod.uiPreview', 'true'
                programArguments.addAll('--width', '1280', '--height', '800')
            }

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        killstreakcod {
            sourceSet sourceSets.main
            if (project.hasProperty('uiPreview')) {
                sourceSet sourceSets.uiPreview
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // 中文：Java 编译使用 UTF-8 字符编码。
}

// Keep the distributable JAR below 100 decimal MB.
// 中文：发行 JAR 须小于十进制 100 MB，防止后续资源更新无意突破体积限制。
tasks.named('jar') {
    doLast {
        def releaseJar = archiveFile.get().asFile
        if (releaseJar.length() >= 100000000L) {
            throw new GradleException("Release JAR must be below 100 MB: ${releaseJar.length()} bytes")
        }
    }
}


// Source-only ports can use separately supplied language resources without copying them into src.
// 中文：仅同步源码的移植工程可加载另行提供的语言资源，不修改 src 下的资源目录。
if (providers.gradleProperty('killstreakLanguageDir').isPresent()) {
    def languageDirectory = file(providers.gradleProperty('killstreakLanguageDir').get()).canonicalFile
    if (!languageDirectory.isDirectory()) {
        throw new GradleException("Language overlay directory does not exist: ${languageDirectory}")
    }
    def originalLanguages = file('src/main/resources/assets/killstreakcod/lang').canonicalFile
    sourceSets.main.resources.exclude { entry -> entry.file.parentFile.canonicalFile == originalLanguages }
    tasks.named('processResources') {
        from(languageDirectory) {
            include '*.json'
            into 'assets/killstreakcod/lang'
        }
    }
}
